name: 4CHAR Scanner

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: 4char-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run one complete scan cycle
        run: python scanner.py

      - name: Commit database
        run: |
          git config user.name "4CHAR Scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/names.json
          if git diff --cached --quiet; then
            echo "Database did not change."
          else
            git commit -m "Update 4CHAR username database"
            git push
          fi

      - name: Start the next scan cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run scanner.yml --ref main
